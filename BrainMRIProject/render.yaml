services:
  - type: web
    name: brain-mri-api
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
